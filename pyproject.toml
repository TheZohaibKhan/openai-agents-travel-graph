[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel_planner"
version = "2.0.0"
description = "AI travel planner built with Google Gemini, LangGraph and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "streamlit>=1.40",
    "google-genai>=2.25",
    "langgraph>=0.4",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
supabase = ["supabase>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["travel_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
